# completed meta_api_cargo_toml
[package]
name = "rc-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rc-api"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tower-http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = "9.3"
bcrypt = "0.15"


sqlx = { workspace = true }

# Signature validation üçün
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"

# Internal crates
rc-auth = { path = "../auth" }
rc-db = { path = "../db" }
rc-deployer = { path = "../deployer" }
rc-proxy = { path = "../proxy" }
rc-scheduler = { path = "../scheduler" }
rc-notify = { path = "../notify" }
rc-storage = { path = "../storage" }
rc-services = { path = "../services" }
rc-sentinel = { path = "../sentinel" }

[package]
name = "rc-auth"
version = "0.1.0"
edition = "2021"

# completed meta_auth_cargo_toml

[dependencies]
rc-db = { path = "../db" }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
sqlx = { workspace = true }
